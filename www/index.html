<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebServ - C2D</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .highlight {
            color: #ffd166;
            font-weight: 500;
        }

        .text {
            margin: 20px 0;
            line-height: 1.6;
        }

        .image-container {
            margin-top: 30px;
        }

        .image-container img {
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .image-container img:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.9em;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hello WebServ 🌐</h1>

        <div class="subtitle">
            presented by the <span class="highlight">amazing Codeuses du Dimanche (C2D group)</span>
            <br>
            in collaboration with <span class="highlight">Sirius</span> and <span class="highlight">Milo</span>
        </div>

        <div class="text">
            Thank you for testing our project.
            <br><br>
            Let’s have some internet cookies together 🍪
        </div>

        <div class="image-container">
            <img src="Assets/404.jpg" alt="Temporary illustration">
        </div>

        <div class="footer">
            (You can replace this image anytime 😉)
        </div>
    </div>
</body>
</html>
