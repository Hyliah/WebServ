server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.com;
    root ./www;
    index index.html;
    client_max_body_size 1000000; # ~1MB

     error_page 404 /errors/404.html;
     error_page 403 /errors/403.html;
     error_page 500 /errors/500.html;

    location / {
        methods GET;
        index home.html;
    }

    location /old { #pour les redirections 
        return 301 /new;
    }
}

# Redirection d'une URL vers une autre
# 301 est le code de statut moved permanently
# /new est la nouvelle URL vers laquelle rediriger

# dasn location config on a bien les 2 variables returnCode et returnUrl
