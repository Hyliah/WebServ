server {
    listen 8080;
    host 127.0.0.1;
    root ./www;
    index index.html;

    location / {
        methods GET POST;
    }

    location /cgi-bin {
        methods GET POST DELETE;
        cgi_info .py /usr/bin/python3;
        cgi_info .sh /usr/bin/;
    }
}