# exemples de fichier de config NGINX

server {
    listen 8080;                    # Port d'écoute
    server_name localhost;           # Nom du serveur
    
    root /var/www/html;             # Racine du site
    index index.html index.htm;      # Fichiers par défaut
    
    client_max_body_size 10M;       # Taille max upload
    
    error_page 404 /404.html;       # Page d'erreur custom
    
    location / {
        allow_methods GET POST;      # Méthodes autorisées
        autoindex off;               # Pas de listing
    }
    
    location /uploads {
        allow_methods GET POST DELETE;
        upload_store /var/www/uploads;
        autoindex on;		# donc seulement pour ce dossier on affiche le listing ?? a checker 
    }
    
    location ~ \.php$ {
        cgi_pass /usr/bin/php-cgi;
        cgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

