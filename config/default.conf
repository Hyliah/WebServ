# PROPOSITION ( to keep or not ):

server {
    listen 8080;
    server_name localhost;
    root /var/www/html;
    index index.html index.htm;
    client_max_body_size 10M;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html; ( internal server error )
	# mettre plus de page d'erreur ici ?? 

    location / {
        allow_methods GET POST DELETE;
        autoindex off;
    }
	# ici on met volontairement off. 
	# C'est le site normakl on veut pas que les gens voient l'arborescence du site

    location /uploads {
        allow_methods GET POST DELETE;
        upload_store /var/www/uploads;
        autoindex on;
        client_max_body_size 50M;
    }
	# la on met on car c'est un dossier ou on veut que les gens puissent uploader des fichiers et voir le listing de ce qu'ils ont uploadé.


	# check ici CGI : PHP ? Python ? a checker car j'ai pas capté
    location ~ \.php$ {
        allow_methods GET POST DELETE;
        cgi_pass /usr/bin/php-cgi;
    }
}

# Ici le deuxieme serveur sur un autre port
server {
    listen 9090;
    server_name localhost;
    root /var/www/site2;
    index index.html;

    location / {
        allow_methods GET POST DELETE;
        autoindex off;
    }
}

# Ici le troisième serveur sur le même port mais avec un server_name différent ( virtual host )
server {
    listen 8080;
    server_name blog.localhost;
    root /var/www/blog;
    index index.html;

    location / {
        allow_methods GET POST DELETE;
        autoindex off;
    }

    location /something {
        allow_methods GET POST DELETE;
        cgi_pass /usr/bin/python3;
    }
}